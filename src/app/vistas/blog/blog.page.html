<ion-content [fullscreen]="true" class="vigi-container">
  <app-logo-utc></app-logo-utc>

  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content 
      pullingIcon="chevron-down-circle-outline" 
      refreshingSpinner="crescent">
    </ion-refresher-content>
  </ion-refresher>

  <div class="blog-content">
    <div style="text-align: center; margin-bottom: 25px; padding-top: 15px;">
      <h1 class="titulo" style="color: white; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 28px;">
        Blog UTC <ion-icon name="newspaper-outline" style="color: white; font-size: 32px;"></ion-icon>
      </h1>
      <hr style="background-color: transparent; border-top: 1px solid rgba(255,255,255,0.15); margin: 0 auto; width: 60%; opacity: 1;" />
    </div>

    <div *ngIf="cargando && posts.length === 0" class="blog-grid">
      <div class="blog-card" *ngFor="let i of [1,2,3]">
        <ion-skeleton-text [animated]="true" style="width: 100%; height: 180px; border-radius: 20px 20px 0 0;"></ion-skeleton-text>
        <div class="card-body">
          <ion-skeleton-text [animated]="true" style="width: 30%; height: 15px;"></ion-skeleton-text>
          <ion-skeleton-text [animated]="true" style="width: 80%; height: 25px; margin: 10px 0;"></ion-skeleton-text>
          <ion-skeleton-text [animated]="true" style="width: 100%; height: 40px;"></ion-skeleton-text>
        </div>
      </div>
    </div>

    <div class="blog-grid" *ngIf="posts.length > 0">
      <div class="blog-card" *ngFor="let post of posts" (click)="leerMas(post)">
        
        <img *ngIf="post.encabezado || post.portada" 
             [src]="post.encabezado || post.portada" 
             class="card-img" 
             alt="Imagen del blog">
        
        <div class="card-body">
          <div class="meta-info">
            <span class="autor">
              <ion-icon name="person-outline"></ion-icon> 
              {{ post.autor || 'Admin UTC' }}
            </span>
          </div>

          <h2 class="card-title">{{ post.titulo }}</h2>
          
          <p class="card-excerpt">
            {{ (post.descripcion_breve || post.contenido) | slice:0:120 }}...
          </p>
          
          <div class="card-footer">
            <small>{{ (post.creacion || post.created_at) | date:'mediumDate' }}</small>
            <ion-icon name="arrow-forward-circle" color="primary"></ion-icon>
          </div>
        </div>
      </div>
    </div>

    <div class="no-data" *ngIf="!cargando && posts.length === 0">
      <ion-icon name="document-text-outline" style="font-size: 3rem; opacity: 0.3;"></ion-icon>
      <p>No se encontraron artículos disponibles.</p>
      <ion-button fill="clear" (click)="cargarPosts()">Reintentar</ion-button>
    </div>

  </div>
  
  <app-custom-navbar></app-custom-navbar>
</ion-content>
