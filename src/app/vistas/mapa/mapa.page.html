<ion-header [translucent]="true">
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Mapa UTC</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [forceOverscroll]="false">
  <div id="map"></div>

  <div id="routingPanel" class="card text-bg-dark border-secondary">
    <div class="card-body p-2">
      <select id="origen" class="form-select mb-2 bg-dark text-white border-secondary">
        <option value="GPS">📍 Mi ubicación</option>
      </select>
      <select id="destino" class="form-select mb-2 bg-dark text-white border-secondary">
        <option value="" disabled selected>¿A dónde vas?</option>
      </select>
      <div class="d-flex justify-content-between align-items-center">
        <button id="btnResetRuta" class="btn btn-sm btn-outline-info">🔄 Reiniciar</button>
        <div id="routeInfo" style="display: none; font-size: 0.8rem;">
          <span id="routeDist"></span> | <span id="routeTime"></span>
        </div>
      </div>
    </div>
  </div>

  <div id="infoPanel" [class.show]="panelVisible">
    <button id="closePanel" (click)="closeInfoPanel()">✖</button>
    <img [src]="currentImg" *ngIf="currentImg" class="info-img">
    <div class="p-3">
      <h3 id="panelTitle">{{ currentTitle }}</h3>
      <div id="panelText" [innerHTML]="currentText"></div>
    </div>
  </div>
</ion-content>
